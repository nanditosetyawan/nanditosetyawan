name: 🕹️ Generate Pac-Man Animation

on:
  schedule:
    # Jalan setiap 24 jam
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    # Hanya memberikan akses 'tulis' untuk file di repo ini saja,
    # bot tidak bisa mengubah pengaturan repo, issue, atau PR.
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 👻 Generate Pac-Man contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
